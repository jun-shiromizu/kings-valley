title: 対局終了後に再戦またはトップページへ移動する
source: docs/product-requirements.md FR-06, FR-07
scenarios:
  - id: ENDGAME-NAV-001
    name: ゲーム画面からトップページへ戻る
    precondition: 対局中のゲームページを表示している
    steps:
      - action: トップページへ戻るを選択する
    expect:
      - トップページが表示される
      - 対局状態が破棄される

  - id: ENDGAME-NAV-002
    name: 終局ダイアログから hard の設定を引き継いで再戦する
    precondition: hard を選択して対局を開始し、終局ダイアログを表示している
    steps:
      - action: 終局ダイアログの「もう一度」を選択する
    expect:
      - 終局ダイアログが閉じる
      - hard の難易度が表示される
      - 初期盤面のゲームが表示される
      - プレイヤーの手番と表示される

  - id: ENDGAME-STATE-001
    name: 再読み込みで対局を破棄する
    precondition: 対局中のゲームページを表示している
    steps:
      - action: ゲームページを再読み込みする
    expect:
      - トップページが表示される
      - 対局状態が復元されない

  - id: ENDGAME-STATE-002
    name: 未定義ルートからトップページへ戻る
    precondition: アプリを表示できる
    steps:
      - action: 未定義のルートへ移動する
    expect:
      - トップページが表示される
